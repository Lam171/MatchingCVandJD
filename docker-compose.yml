services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cvjd
      POSTGRES_USER: cvjd
      POSTGRES_PASSWORD: cvjd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvjd -d cvjd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
